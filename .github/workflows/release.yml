name: Release

on:
  push:
    branches: [master]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # 允许 action 创建 "Version Packages" 提交/PR
  pull-requests: write # 允许开版本 PR

jobs:
  release:
    name: Version or Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # version-packages regenerates the localized changelog; annotated release tags are
          # the source of its dates, so a shallow checkout would publish incomplete site data.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 8.15.5

      - name: Setup Node (npmjs registry)
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
          scope: "@hulianui"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # changesets/action 的两种行为:
      #  - 若存在未消费的 .changeset/*.md → 开/更新 "Version Packages" PR(bump 版本 + 写 changelog)
      #  - 若没有待消费 changeset 且 package.json 版本高于已发布版本 → 跑 `pnpm release` 发布
      #
      # `version-packages` 在 `changeset version` 之后补跑 llms-registry + changelog:
      # apps/www/public/registry.json 与 apps/www/lib/changelog.json 都带版本号且都是提交进仓库的
      # 生成物,而 changesets 只认 package.json/CHANGELOG.md。不在这里一并重生成,本地检出的产物
      # 就会永远落后一个 release,本地模式的 MCP 据此答题会缺掉当版新增的组件与 prop(#47/#48)。
      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # changesets/action 用于开 Version PR / 打 tag
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # 发布到公共 npmjs 的鉴权（需在仓库 secrets 配置）
