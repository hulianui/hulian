name: Release

on:
  push:
    branches: [master]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # 允许 action 创建 "Version Packages" 提交/PR
  pull-requests: write # 允许开版本 PR

jobs:
  release:
    name: Version or Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 8.15.5

      - name: Setup Node (npmjs registry)
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
          scope: "@hulianui"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # changesets/action 的两种行为:
      #  - 若存在未消费的 .changeset/*.md → 开/更新 "Version Packages" PR(bump 版本 + 写 changelog)
      #  - 若没有待消费 changeset 且 package.json 版本高于已发布版本 → 跑 `pnpm release` 发布
      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # changesets/action 用于开 Version PR / 打 tag
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # 发布到公共 npmjs 的鉴权（需在仓库 secrets 配置）
