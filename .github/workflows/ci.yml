name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# 同一分支/PR 新推送时取消仍在跑的旧任务，省 CI 时间
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 全量类型检查（@hulianui/ui + apps/www）
      - name: Typecheck
        run: pnpm typecheck

      # 1887 个 vitest 用例
      - name: Test
        run: pnpm test

      # 生产构建（apps/www 静态导出 + 包构建），验证可发布
      - name: Build
        run: pnpm build
