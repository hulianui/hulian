name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# 同一分支/PR 新推送时取消仍在跑的旧任务，省 CI 时间
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 工具链版本的单一来源：Node 读 .nvmrc（全仓四处 setup-node 都用 node-version-file，
# 不再各写各的 `node-version: 22`），pnpm 由根 package.json 的 packageManager 字段与
# 这里的 version 共同钉死。
#
# 为什么要钉到补丁号而不是留 `22`：vite 8 要求 ^20.19.0 || >=22.12.0，jsdom 27.4 要求
# ^20.19 || ^22.12 || >=24 —— 浮动的 major 会让一台 Node 20.0~20.18 的开发机安静装上，
# 然后崩在 rolldown 的 native binding 上，报错栈毫无指向性。根 engines 已按这两条的
# 交集收紧，`.nvmrc` 则保证「本地 == CI」跑的是同一个补丁版本。
jobs:
  verify:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 8.15.5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 全量类型检查（@hulianui/ui + apps/www）
      - name: Typecheck
        run: pnpm typecheck

      # 2705 个 vitest 用例
      - name: Test
        run: pnpm test

      # 生产构建：仅 apps/www 静态导出（含其依赖的 workspace 包）。
      # 排除 desktop#build —— 那是 Tauri 构建，需 Rust + 系统库，且会与 www build 抢 next 锁，不适合本 CI。
      - name: Build
        run: pnpm --filter www build

      # 把静态导出产物传给下游 deploy-zh job（避免二次构建）
      - name: Upload static export
        uses: actions/upload-artifact@v6
        with:
          name: www-out
          path: apps/www/out
          retention-days: 1
          if-no-files-found: error

  # 以消费方身份 typecheck —— 防「库内 tsc 绿、装出去就挂」这一整类问题。
  #
  # 上面 verify 里的 `pnpm typecheck` 跑在库自己的环境里，而那个环境比真实消费方**宽松**：
  # packages/ui/tsconfig.json 的 `types: ["vitest/globals"]` 会顺着 vitest 的类型链把
  # @types/node 混进来，于是库里任何一处裸 `process` / `Buffer` 在库内合法、在只跑浏览器的
  # 消费方那里却是 TS2580（hulianui/hulian#24）；同理 monorepo 根 node_modules 有求必应，
  # 掩盖了 barrel 拖出的依赖缺失（hulianui/hulian#19）。
  #
  # 这道门禁刻意还原消费方的类型环境：走 pnpm pack 产物（不是 workspace 链接）、不装
  # @types/node、tsconfig 不写 types 字段、临时工程建在 ${{ runner.temp }}（仓库之外，
  # 否则 tsc 上溯会捡到 monorepo 根的 @types/node，门禁形同虚设）。
  # 具体步骤与各处断言见 scripts/consumer-typecheck.sh 里的注释。
  #
  # **跑两个 TS 大版本**：瑚琏是源码分发，下游用他们自己的 tsc 编译我们的 .tsx，所以
  # 「支持哪些 TypeScript」只有这道门禁能证明。仓库自己升到 TS7 之后若把这里也一并换成
  # TS7，就等于静默放弃了 TS5 消费方 —— 而 TS5 目前仍是绝大多数下游的现状。反过来只留
  # TS5 也不行：TS≥6 独有的失败是真实存在的（Video 的 TS2882，见 f4328bb）。两版共用一次
  # checkout、顺序跑，增量约 30 秒，换的是两条真实消费路径的覆盖。
  #
  # 与 verify 并行、不设 needs：它测的是发布产物的可消费性，与文档站构建互不依赖。
  consumer-smoke:
    name: Consumer Typecheck (packed tarball)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 8.15.5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # 有意不在仓库根跑 pnpm install：pack 不需要 node_modules，
      # 且少装一次也少一分把 monorepo 依赖泄漏给消费方工程的机会。
      - name: Pack, install as a consumer, typecheck (TypeScript 7)
        env:
          CONSUMER_SMOKE_DIR: ${{ runner.temp }}/hulian-consumer-smoke-ts7
          CONSUMER_TS_VERSION: ^7.0.2
        run: bash scripts/consumer-typecheck.sh

      # 不设 continue-on-error：TS5 消费方挂了同样是发版级问题，不能只当参考信息。
      - name: Pack, install as a consumer, typecheck (TypeScript 5)
        env:
          CONSUMER_SMOKE_DIR: ${{ runner.temp }}/hulian-consumer-smoke-ts5
          CONSUMER_TS_VERSION: ^5.5.0
        run: bash scripts/consumer-typecheck.sh

  # 消费方 bundle 体积门禁 —— 拦「组件悄悄变胖」这一类回归。
  #
  # 源码分发的库量不出体积：仓库里没有 dist/，`du -sh src` 与消费方实际付出的字节
  # 没有换算关系。所以这道门禁和 consumer-smoke 一样走 pnpm pack 产物 + 仓库外空白工程，
  # 只是把 tsc 换成 esbuild，量各入口 minify+gzip 后的 initial chunk。
  # 基线在 scripts/size-limits.json，量法与判据见 scripts/bundle-size.mjs 顶部注释。
  #
  # 与其它 job 并行、不设 needs：它测的是发布产物的体积，与文档站构建互不依赖。
  bundle-size:
    name: Bundle Size (packed tarball)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 8.15.5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # 同 consumer-smoke：pack 不需要仓库根的 node_modules。
      - name: Pack, bundle as a consumer, check size
        env:
          BUNDLE_SIZE_DIR: ${{ runner.temp }}/hulian-bundle-size
        run: bash scripts/bundle-size.sh

  # 中国镜像站点：push 到 master 时把静态产物 rsync 到阿里云服务器
  # （hulianui-zh.haloritual.com · 直连阿里云绕开 Cloudflare）。
  # 与 Cloudflare Pages 自动发布并行 —— 双发，同一份产物。
  deploy-zh:
    name: Deploy · hulianui-zh.haloritual.com
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Download static export
        uses: actions/download-artifact@v7
        with:
          name: www-out
          path: out

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ZH_DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.ZH_DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # --delete 镜像同步：服务器站点目录 = out/ 内容的精确副本
      - name: Rsync to server
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            out/ \
            "${{ secrets.ZH_DEPLOY_USER }}@${{ secrets.ZH_DEPLOY_HOST }}:${{ secrets.ZH_DEPLOY_PATH }}/"

      - name: Cleanup key
        if: always()
        run: rm -f ~/.ssh/deploy_key
