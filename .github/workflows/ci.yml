name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# 同一分支/PR 新推送时取消仍在跑的旧任务，省 CI 时间
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 工具链版本的单一来源：Node 读 .nvmrc（全仓四处 setup-node 都用 node-version-file，
# 不再各写各的 `node-version: 22`），pnpm 由根 package.json 的 packageManager 字段与
# 这里的 version 共同钉死。
#
# 为什么要钉到补丁号而不是留 `22`：vite 8 要求 ^20.19.0 || >=22.12.0，jsdom 27.4 要求
# ^20.19 || ^22.12 || >=24 —— 浮动的 major 会让一台 Node 20.0~20.18 的开发机安静装上，
# 然后崩在 rolldown 的 native binding 上，报错栈毫无指向性。根 engines 已按这两条的
# 交集收紧，`.nvmrc` 则保证「本地 == CI」跑的是同一个补丁版本。
jobs:
  verify:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 拉全量历史与 tag —— changelog 的发布日期只存在于 `@hulianui/ui@x.y.z`
      # 这类 annotated tag 上，浅克隆拿不到，构建期生成的 changelog.json 会整片丢日期。
      # 仓库 .git 不到 30 MB，全量克隆的代价可以忽略。
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 8.15.5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check generated conventions
        run: pnpm conventions:check

      # 门禁只扫对外分发的组合源码与组件实现；文档 demo 为展示动画允许局部 style，public
      # 还包含扩展名为 .ts 的 HLS 二进制分片，都不属于业务消费代码。
      - name: Guard distributable UI usage
        run: pnpm guard -- apps/www/app/blocks/_blocks apps/www/app/pages/_pages packages/ui/src

      # 全量类型检查（@hulianui/ui + apps/www）
      - name: Typecheck
        run: pnpm typecheck

      # vitest 分两个 project 跑（见 packages/ui/vitest.config.ts）：
      #   unit    —— jsdom，props→DOM 契约与纯逻辑，占绝大多数
      #   browser —— 真实 chromium，拖拽/指针捕获/动画/布局定位这些在 jsdom 下结论不可信的部分
      # 后者需要真实浏览器二进制，装了才能跑；只装 chromium（不是全部三个内核）省 CI 时间。
      - name: Install Playwright chromium
        run: pnpm --filter @hulianui/ui exec playwright install --with-deps chromium

      # MCP 的 install_block 端到端测试读取 apps/www/public/r/*.json 中的完整源码。
      # 这些拆分端点被 Git 忽略，因此干净 checkout 必须先生成再测试；否则本地残留产物
      # 会掩盖 CI 中的真实缺失。后面的页面 smoke、构建和部署继续复用同一份生成结果。
      - name: Generate AI distribution endpoints
        # /r、/d 与 conventions.json 都被 Git 忽略，必须在干净 checkout 中显式生成，
        # 否则 MCP 的本地模式和部署后的远程模式都会拿不到逐件文档或约束数据。
        run: pnpm llms-registry && pnpm conventions

      # changelog.json 与上面几个端点不同，它被提交进仓（/changelog 页面 import 它，
      # 干净 clone 必须能 typecheck）。但仓库里那份只是**开发期占位**：只要不在构建期
      # 按当前 CHANGELOG.md + tag 重新生成，站点就会停在最后一次人工回填的版本上——
      # 0.14.0 发版后站点长期显示旧版就是这么来的。这里重生成，把「发版后记得跑一次
      # pnpm changelog 再提交」这个纯人工步骤从发布流程里彻底去掉。
      - name: Regenerate changelog data
        run: pnpm changelog

      - name: Test
        run: pnpm test

      # scripts/ 不是 workspace 包，`turbo run test` 扫不到它 —— 这些 node:test 套件
      # （a11y/registry-smoke/llms-registry/conventions/viewport 的判据）此前写了却从未被执行。
      - name: Test build scripts
        run: pnpm test:scripts

      # 每个页面都在独立临时工程中经真实 shadcn CLI 递归安装并 typecheck，防止前一个页面
      # 已安装的区块掩盖后一个页面漏写 registryDependencies。
      - name: Smoke all registry pages
        run: pnpm registry:smoke:pages

      # 生产构建：仅 apps/www 静态导出（含其依赖的 workspace 包）。
      # 排除 desktop#build —— 那是 Tauri 构建，需 Rust + 系统库，且会与 www build 抢 next 锁，不适合本 CI。
      - name: Build
        run: pnpm --filter www build

      - name: Accessibility gate
        run: pnpm a11y

      # 响应式门禁：按视口量正文的**几何**。#39 那类 bug（正文被生成、但祖先 display:none）
      # 在 SSR HTML、sitemap、typecheck、构建甚至 axe 里全是绿的，只有按宽度量面积才拦得住。
      - name: Responsive viewport gate
        run: pnpm viewport

      # 画廊预算：已挂载预览数 / 顶层 DOM 数 / 控制台 warning。
      # 拦「把整座画廊当活组件同时挂上」这类回归 —— 它不会让任何测试变红，只会让页面变慢。
      - name: Gallery mount budget gate
        run: pnpm gallery

      # 把静态导出产物传给下游 deploy-zh job（避免二次构建）
      - name: Upload static export
        uses: actions/upload-artifact@v6
        with:
          name: www-out
          path: apps/www/out
          retention-days: 1
          if-no-files-found: error

  # 以消费方身份 typecheck —— 防「库内 tsc 绿、装出去就挂」这一整类问题。
  #
  # 上面 verify 里的 `pnpm typecheck` 跑在库自己的环境里，而那个环境比真实消费方**宽松**：
  # packages/ui/tsconfig.json 的 `types: ["vitest/globals"]` 会顺着 vitest 的类型链把
  # @types/node 混进来，于是库里任何一处裸 `process` / `Buffer` 在库内合法、在只跑浏览器的
  # 消费方那里却是 TS2580（hulianui/hulian#24）；同理 monorepo 根 node_modules 有求必应，
  # 掩盖了 barrel 拖出的依赖缺失（hulianui/hulian#19）。
  #
  # 这道门禁刻意还原消费方的类型环境：走 pnpm pack 产物（不是 workspace 链接）、不装
  # @types/node、tsconfig 不写 types 字段、临时工程建在 ${{ runner.temp }}（仓库之外，
  # 否则 tsc 上溯会捡到 monorepo 根的 @types/node，门禁形同虚设）。
  # 具体步骤与各处断言见 scripts/consumer-typecheck.sh 里的注释。
  #
  # **跑两个 TS 大版本**：瑚琏是源码分发，下游用他们自己的 tsc 编译我们的 .tsx，所以
  # 「支持哪些 TypeScript」只有这道门禁能证明。仓库自己升到 TS7 之后若把这里也一并换成
  # TS7，就等于静默放弃了 TS5 消费方 —— 而 TS5 目前仍是绝大多数下游的现状。反过来只留
  # TS5 也不行：TS≥6 独有的失败是真实存在的（Video 的 TS2882，见 f4328bb）。两版共用一次
  # checkout、顺序跑，增量约 30 秒，换的是两条真实消费路径的覆盖。
  #
  # 与 verify 并行、不设 needs：它测的是发布产物的可消费性，与文档站构建互不依赖。
  consumer-smoke:
    name: Consumer Typecheck (packed tarball)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 8.15.5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # 有意不在仓库根跑 pnpm install：pack 不需要 node_modules，
      # 且少装一次也少一分把 monorepo 依赖泄漏给消费方工程的机会。
      - name: Pack, install as a consumer, typecheck (TypeScript 7)
        env:
          CONSUMER_SMOKE_DIR: ${{ runner.temp }}/hulian-consumer-smoke-ts7
          CONSUMER_TS_VERSION: ^7.0.2
        run: bash scripts/consumer-typecheck.sh

      # 不设 continue-on-error：TS5 消费方挂了同样是发版级问题，不能只当参考信息。
      - name: Pack, install as a consumer, typecheck (TypeScript 5)
        env:
          CONSUMER_SMOKE_DIR: ${{ runner.temp }}/hulian-consumer-smoke-ts5
          CONSUMER_TS_VERSION: ^5.5.0
        run: bash scripts/consumer-typecheck.sh

  # 消费方 bundle 体积门禁 —— 拦「组件悄悄变胖」这一类回归。
  #
  # 源码分发的库量不出体积：仓库里没有 dist/，`du -sh src` 与消费方实际付出的字节
  # 没有换算关系。所以这道门禁和 consumer-smoke 一样走 pnpm pack 产物 + 仓库外空白工程，
  # 只是把 tsc 换成 esbuild，量各入口 minify+gzip 后的 initial chunk。
  # 基线在 scripts/size-limits.json，量法与判据见 scripts/bundle-size.mjs 顶部注释。
  #
  # 与其它 job 并行、不设 needs：它测的是发布产物的体积，与文档站构建互不依赖。
  bundle-size:
    name: Bundle Size (packed tarball)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 8.15.5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # 同 consumer-smoke：pack 不需要仓库根的 node_modules。
      - name: Pack, bundle as a consumer, check size
        env:
          BUNDLE_SIZE_DIR: ${{ runner.temp }}/hulian-bundle-size
        run: bash scripts/bundle-size.sh

  # 中国镜像站点：push 到 master 时把静态产物 rsync 到阿里云服务器
  # （hulianui-zh.haloritual.com · 直连阿里云绕开 Cloudflare）。
  # 与 Cloudflare Pages 自动发布并行 —— 双发，同一份产物。
  deploy-zh:
    name: Deploy · hulianui-zh.haloritual.com
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Download static export
        uses: actions/download-artifact@v7
        with:
          name: www-out
          path: out

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ZH_DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.ZH_DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # --delete 镜像同步：服务器站点目录 = out/ 内容的精确副本
      - name: Rsync to server
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            out/ \
            "${{ secrets.ZH_DEPLOY_USER }}@${{ secrets.ZH_DEPLOY_HOST }}:${{ secrets.ZH_DEPLOY_PATH }}/"

      - name: Cleanup key
        if: always()
        run: rm -f ~/.ssh/deploy_key
