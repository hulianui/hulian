# ── 根路径语言分流的两条判据 ────────────────────────────────────────────────
# 镜像站与主站共用同一份产物，而产物根目录是**英文站**（英文页要占住根域，品牌词
# hulianui 是英文查询），中文挂在 /zh 下。镜像站是中国用户的中文入口，所以根路径默认
# 跳 /zh —— 不跳的话中国用户打开本站首屏是英文，镜像站就失去了存在意义。
#
# 但这一跳有个致命副作用：**英文首页的 URL 恰好就是 `/`**。语言切换器在中文页点
# 「English」生成的正是它（见 lib/docs-locale.ts 的 withDocsBasePath，根语言无前缀），
# 于是跳过去又被弹回 /zh —— 镜像站上英文首页不可达，用户看到的是「点了没反应」。
# 下面两条判据就是给「用户显式要英文」留的逃生口。
#
# 判据一（cookie）：语言切换器点击时写 hl_locale，显式选择跨刷新、跨重访都生效。
#   只需区分 en：选中文的人点的是 /zh，压根不经过 `location = /`；他之后裸敲域名被送
#   去 /zh 也正是他要的，与默认行为一致。
# 判据二（referer）：根路径带本站 referer = 站内导航（点 English），不是「裸敲域名」。
#   cookie 随前端产物发布前，这条单独兜住语言切换；发布后它继续覆盖 cookie 被清的情况。
#
# 两条都不命中 = 访客从站外/搜索结果裸进首页 → 照旧送中文。
map $cookie_hl_locale $hl_root_cookie_en {
    default  0;
    "en"     1;
}

map $http_referer $hl_root_from_site {
    default                                         0;
    "~*^https://hulianui-zh\.haloritual\.com(/|$)"  1;
}

map "$hl_root_cookie_en$hl_root_from_site" $hl_root_redirect {
    default  "/zh";   # 00 —— 两条判据都没表态，裸进首页，送中文
    "01"     "";      # 站内跳来
    "10"     "";      # 显式选过英文
    "11"     "";      # 两者兼备
}

server {
    listen 80;
    listen [::]:80;
    server_name hulianui-zh.haloritual.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hulianui-zh.haloritual.com;

    ssl_certificate     /www/server/panel/vhost/cert/haloritual.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/haloritual.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root  /www/wwwroot/hulianui-zh.haloritual.com;
    index index.html;

    access_log /www/wwwlogs/hulianui-zh.haloritual.com.log;
    error_log  /www/wwwlogs/hulianui-zh.haloritual.com.error.log;

    # gzip（静态文本资源）
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2 application/wasm;

    # Next 静态导出的 hash 资源 · 永久缓存
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 拒绝隐藏/敏感文件
    location ~ /\.(?!well-known) { deny all; }

    # 只重定向根路径：深链（/components/button 之类）保持原样，英文页在镜像站照常可达。
    # 目标不带尾斜杠 —— 下面的 rewrite 规则会把 /zh/ 再 301 成 /zh，直接跳到终点少一跳。
    # 用 302 不用 301：语言布局属于可调策略，别让浏览器把这一跳永久缓存住。
    #
    # $hl_root_redirect 为空 = 用户显式要英文（判据见文件顶部的 map），此时不跳，
    # 直接把根产物 index.html 发出去 —— 这就是英文首页本身。
    location = / {
        if ($hl_root_redirect) {
            return 302 $hl_root_redirect;
        }
        try_files /index.html =404;
    }

    # 英文站原本挂在 /en/*，现已搬到站点根。旧地址进过搜索引擎索引，不 301 就会集体 404。
    # 主站侧由 public/_redirects 承担同一职责，两边规则必须保持一致。
    location = /en {
        return 301 /;
    }
    location ^~ /en/ {
        rewrite ^/en/(.*)$ /$1 permanent;
    }

    # Next 16 静态导出 clean-url：/foo → foo.html；带目录的取 index.html。
    location / {
        # 尾斜杠规范化，对齐主站（Cloudflare Pages 对 /foo/ 发 308 去斜杠）。
        # 不做的话带尾斜杠的**合法页面**会静默变 404 页：try_files 拼出的是
        # `/foo/.html` 与 `/foo//index.html`，两个都不存在。用户从主站复制一条
        # 带斜杠的链接过来就撞这个。
        #
        # 不会与 nginx 自身的「目录补斜杠」形成循环：下面 try_files 的 `$uri`
        # 不以 / 结尾，只匹配**文件**，命中不到目录，所以不会反向 301 加回斜杠。
        # 根路径 `/` 也不匹配本规则（`(.+)` 要求斜杠前至少一个字符）。
        rewrite ^/(.+)/$ /$1 permanent;

        # 末位用 =404 而不是 /404.html：后者是**内部重定向**，状态码会保持 200，
        # 于是任意不存在的 URL 都成了「200 + 404 页内容」的软 404 —— 搜索引擎会把
        # 它们当正常页收录，人工验证部署时也会被 200 骗过去。
        # 真 404 由下面的 error_page 交还同一张页面。
        try_files $uri $uri.html $uri/index.html =404;
    }

    # 404 页内容仍是 Next 导出的那张，但带正确的 404 状态码。
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
