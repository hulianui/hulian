[package]
name = "hulian-desktop"
version = "0.0.0"
description = "瑚琏 Hulian — 设计系统桌面壳"
authors = ["haloritual"]
license = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "hulian_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.2", features = ["devtools"] }
tauri-plugin-single-instance = "2"
